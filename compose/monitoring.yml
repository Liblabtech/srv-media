# =============================================================================
# srv-media — Monitoring
# =============================================================================
# Prometheus, Grafana, Blackbox Exporter, cAdvisor
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  media-network:
    external: true

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    user: "${PUID}:${PGID}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.listen-address=:9080"
    ports:
      - "${PROMETHEUS_PORT:-9080}:9080"
    volumes:
      - ${CONFIG_PATH}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_PATH}/prometheus:/prometheus
    networks:
      - media-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: ${RESTART_POLICY:-unless-stopped}
    privileged: true
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - media-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    command:
      - "--config.file=/config/blackbox.yml"
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    volumes:
      - ${CONFIG_PATH}/blackbox/blackbox.yml:/config/blackbox.yml:ro
    networks:
      - media-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    user: "${PUID}:${PGID}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_DOMAIN: grafana.media.lib-lab.cloud
      GF_SERVER_ROOT_URL: https://grafana.media.lib-lab.cloud/
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${CONFIG_PATH}/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${CONFIG_PATH}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${CONFIG_PATH}/grafana/data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - media-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "${PUID}:${PGID}"
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ${CONFIG_PATH}/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - ${CONFIG_PATH}/loki/data:/loki
    networks:
      - media-network