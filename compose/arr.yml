# =============================================================================
# srv-media — Arr Stack & Download
# =============================================================================
# Sonarr, Radarr, Lidarr, Bazarr, Prowlarr, Transmission, FlareSolverr
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

networks:
  media-network:
    external: true

services:
  # ─── SONARR (TV Shows) ──────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── RADARR (Movies) ────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - ${DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── LIDARR (Music) ─────────────────────────────────────────────
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    volumes:
      - ${CONFIG_PATH}/lidarr:/config
      - ${DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── BAZARR (Subtitles) ─────────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - ${DATA_PATH}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── PROWLARR (Indexer Manager) ─────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── TRANSMISSION (Torrent Client) ──────────────────────────────
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      <<: *common-env
      USER: ${TRANSMISSION_USER:-}
      PASS: ${TRANSMISSION_PASS:-}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    ports:
      - "${TRANSMISSION_PORT:-9091}:9091"
      - "${TRANSMISSION_PEER_PORT:-51413}:51413"
      - "${TRANSMISSION_PEER_PORT:-51413}:51413/udp"
    volumes:
      - ${CONFIG_PATH}/transmission:/config
      - ${DATA_PATH}/torrents:/data/torrents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # ─── FLARESOLVERR (Cloudflare Bypass) ───────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *default-logging
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - media-network
