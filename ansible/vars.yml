data_path: /mnt/data-iscsi
config_path: /opt/srv-media
project_path: /opt/srv-media

timezone: Europe/Paris
vars:  
    system_packages:
    - htop
    - iotop
    - ncdu
    - tree
    - tmux
    - vim
    - net-tools

tasks:
