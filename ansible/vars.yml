    ansible.builtin.apt:
      name: "{{ system_packages }}"
      state: present
      update_cache: true
      
extra_packages:
  - htop
  - iotop
  - ncdu
  - tree
  - tmux
  - vim
  - net-tools
  - htop
  - iotop
  - ncdu
  - tree
  - tmux
  - vim
  - net-tools
smb_mounts: []

nfs_mounts: []

iscsi_targets:
    - name: mnt-data-iscsi
      portal: "172.0.16.151:3260"
      target: "iqn.2004-04.com.qnap:ts-219pii:iscsi.media.000509"
      device: "/dev/sdb1"
      mount_point: /mnt/data-iscsi
      fs_type: ext4
      options: "defaults,_netdev,nofail"
